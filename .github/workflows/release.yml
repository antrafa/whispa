name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: ''
            args: ''
          - platform: 'windows-latest'
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev \
            build-essential patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Whispa v__VERSION__'
          releaseBody: |
            Instaladores gerados automaticamente pelo CI. O macOS recebe uma
            assinatura ad-hoc válida, mas ainda não há Developer ID/notarização;
            macOS (Gatekeeper) e Windows (SmartScreen) podem exigir liberação manual.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: verify macOS bundle signature and disk image
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          codesign --verify --deep --strict --verbose=4 "$mount_dir/Whispa.app"
