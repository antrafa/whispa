[package]
name = "whispa"
version = "0.1.0"
description = "Ditado por voz com atalho global — grava, transcreve e cola em qualquer app"
authors = ["Antonio Rafael Ortega"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whispa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls-native-roots"] }

# No Linux/GNOME o atalho global via API nativa não é confiável no Wayland
# (por isso o fluxo de setup guiado com atalho personalizado do GNOME).
# Windows e macOS suportam registro de atalho global nativo de verdade.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

